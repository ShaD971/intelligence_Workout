apply plugin: 'com.android.application'

android {
    namespace 'com.example.shad.projetosnomade'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.shad.projetosnomade"
        minSdk 15
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    testImplementation 'junit:junit:4.13.2'
}
